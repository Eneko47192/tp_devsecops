name: CI

on:
  push:
    branches:
      - main

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execution du script
        run: python app.py

      - name: Construction image Docker
        run: docker build -t tp-devsecops .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tp-devsecops"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
